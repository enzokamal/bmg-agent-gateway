# Default values for agent subchart

# Namespace (inherited from parent)

# Agent Configuration
configMap:
  name: "agent-config"
  agentMode: "api"
  agentPort: "8070"
  agentHost: "0.0.0.0"
  mcpServersJson: '[{"url":"http://agentgateway-proxy.{{ .Values.global.namespace }}.svc.cluster.local:8080/mcp/mcp-mssql"}]'
deployment:
  name: "agent-deployment"
  replicas: 1
  image:
    repository: "sawnjordan/multi-agent"
    tag: "v0.8"
    pullPolicy: "IfNotPresent"
  ports:
    - containerPort: 8000
    - containerPort: 8070
service:
  name: "agent-service"
  type: "ClusterIP"
  port: 8070
  targetPort: 8070
secret:
  name: "agent-secrets"
  deepseekApiKey: ""