# Main deployment configuration for BMG Agent Gateway
# This is the base configuration used across all environments

global:
  # Global settings shared across all components
  imageRegistry: ""  # Set in environment-specific files
  imagePullSecrets: []
  environment: develop  # Default environment
  namespace: "bmg-develop"  # Override in environment files
  # Azure Configuration (shared)
  azure:
    clientId: "11ddc0cd-e6fc-48b6-8832-de61800fb41e"  # Set in environment files
    tenantId: "6ba231bb-ad9e-41b9-b23d-674c80196bbd"  # Set in environment files

# Agent Configuration
agent:
  deployment:
    name: "agent-deployment"
    replicas: 1  # Override in environment files
    image:
      repository: "sawnjordan/multi-agent"
      tag: "v0.8"  # Override in environment files
      pullPolicy: "IfNotPresent"
    ports:
      - containerPort: 8000
      - containerPort: 8070
  service:
    name: "agent-service"
    type: "ClusterIP"
    port: 8070
    targetPort: 8070
  secret:
    name: "agent-secrets"
    deepseekApiKey: ""  # Set in environment files
  configMap:
    name: "agent-config"
    agentMode: "api"
    agentPort: "8070"
    agentHost: "0.0.0.0"
    mcpServersJson: '[{"url":"http://agentgateway-proxy.{{ .Values.global.namespace }}.svc.cluster.local:8080/mcp/mcp-mssql"}]'

# UI Configuration
ui:
  deployment:
    name: "ui"
    replicas: 1  # Override in environment files
    image:
      repository: "kamalberrybytes/adk-web-ui"
      tag: "v5"  # Override in environment files
      pullPolicy: "Always"
    port: 5000
    env:
      clientId: "11ddc0cd-e6fc-48b6-8832-de61800fb41e"  # Set in environment files
      tenantId: "6ba231bb-ad9e-41b9-b23d-674c80196bbd"
      redirectUri: "http://localhost:5000/auth/callback"
      azureScopes: "openid api://11ddc0cd-e6fc-48b6-8832-de61800fb41e/mcp.access"
      gatewayUrl: "http://agentgateway-proxy.{{ .Values.global.namespace }}.svc.cluster.local:8080"
      adkApi: "http://agent-service.{{ .Values.global.namespace }}.svc.cluster.local:8070"
  secret:
    name: "ui-secrets"
    azureClientSecret: ""  # Set in environment files
    secretKey: "helloworld"
  service:
    name: "ui-service"
    port: 5000
    targetPort: 5000
  httpRoute:
    name: "ui"

# MCP HubSpot Configuration
mcp-hubspot:
  deployment:
    name: "mcp-hubspot"
    replicas: 1
    image:
      repository: "kamalberrybytes/mcp-hubspot"
      tag: "latest"
      pullPolicy: "Always"
  service:
    name: "mcp-hubspot-service"
    port: 8000
    targetPort: 8000
    appProtocol: "kgateway.dev/mcp"
  backend:
    name: "mcp-hubspot-backend"
    targetName: "mcp-hubspot-target"
    host: "mcp-hubspot-service.{{ .Values.global.namespace }}.svc.cluster.local"
    protocol: "StreamableHTTP"
  httpRoute:
    name: "mcp-hubspot"

# MCP MSSQL Configuration
mcp-mssql:
  deployment:
    name: "mcp-mssql"
    replicas: 1
    image:
      repository: "kamalberrybytes/mssql-mcp"
      tag: "latest"  # Override in environment files
      pullPolicy: "Always"
    env:
      # These must be set in environment-specific files
      mssqlServer: ""  # REQUIRED: Set in environment files
      mssqlDatabase: "msdb"
      mssqlPort: "1433"
      mssqlUser: "sa"
      mssqlPassword: ""  # REQUIRED: Set in environment files
  service:
    name: "mcp-mssql-service"
    port: 8000
    targetPort: 8000
    appProtocol: "kgateway.dev/mcp"
  backend:
    name: "mcp-mssql-backend"
    targetName: "mcp-mssql-target"
    host: "mcp-mssql-service.{{ .Values.global.namespace }}.svc.cluster.local"
    protocol: "StreamableHTTP"
  httpRoute:
    name: "mcp-mssql"

# Gateway Configuration
gateway:
  name: "agentgateway-proxy"
  gatewayClassName: "agentgateway"
  listeners:
    - protocol: "HTTP"
      port: 8080
      name: "http"
      allowedRoutes:
        namespaces:
          from: "All"

# Policy Configuration
policy:
  name: "azure-mcp-authn-policy"
  targetRefs:
    - group: "gateway.networking.k8s.io"
      kind: "Gateway"
  jwtAuthentication:
    mode: "Strict"
    providers:
      - cacheDuration: "5m"
        backendRef:
          group: ""
          kind: "Service"
          name: "azure-ad-jwks"
          port: 443
  jwksService:
    name: "azure-ad-jwks"
    externalName: "login.microsoftonline.com"